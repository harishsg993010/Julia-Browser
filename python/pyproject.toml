[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "julia-browser"
version = "3.0.0"
description = "A headless web browser for Python: real JavaScript (SpiderMonkey), layout, screenshots and an agent API, written in Rust"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Harish Santhanalakshmi Ganesan", email = "harishsg99@gmail.com" }]
requires-python = ">=3.9"
keywords = ["browser", "headless", "javascript", "spidermonkey", "scraping", "automation", "agent", "screenshot", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
julia-browser-py = "julia_browser.__main__:main"

[project.urls]
Homepage = "https://github.com/juliabrowser/julia-browser"

[tool.maturin]
module-name = "julia_browser._native"
python-source = "."
python-packages = ["julia_browser"]
features = ["pyo3/extension-module"]
strip = true
