[package]
name = "julia-browser-py"
version = "3.0.0"
edition = "2021"
authors = ["Harish Santhanalakshmi Ganesan <harishsg99@gmail.com>"]
description = "Python bindings (PyO3) for the julia-browser engine"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
julia-browser = { path = "..", features = ["screenshot", "images"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
